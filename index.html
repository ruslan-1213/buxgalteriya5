aho tangalarning qiymati aks ettiriladi."],"10999":["bankning tijorat faoliyati uchun sotib olgan qimmatbaho metallar, toshlar va tangalarining qadrsizlanishi natijasida yuzaga keladigan zararlarni qoplash uchun moʻljallangan mablagʻlari hisobi olib boriladi.","Hisobvaraqning debetida zaxiraning kamayish summasi yoki bekor qilingan summasi aks ettiriladi.","Hisobvaraqning kreditida baholangan ehtimoliy yoʻqotishlar summasi yoki zaxiraning oʻsish summasi aks ettiriladi."],"11101":["bank tomonidan sotib olingan debitorlik qarzlari — joʻnatilgan tovarlar, bajarilgan ish va koʻrsatilgan xizmatlar uchun oʻz mijozlari (mahsulot yetkazib beruvchi) tomonidan inkassoga qoʻyilgan toʻlov talabnomalarining hisobi olib boriladi.","Hisobvaraqning debetida bank tomonidan sotib olingan mijozlarning debitorlik qarzlarining nominal qiymati aks ettiriladi.","Hisobvaraqning kreditida qarzdorlar tomonidan toʻlangan debitorlik qarzlarining qiymati, qayta tasniflangan, 11103, 11105 hisobvaraqlarga oʻtkazilgan, shuningdek boshqa shaxslar hisobiga kechib yuborilgan debitorlik qarzlarining qiymati aks ettiriladi."],"11103":["belgilangan qoidalarga muvofiq muddati oʻtgan deb tasniflangan sotib olingan debitorlik qarzlarining hisobi olib boriladi.","Hisobvaraqning debetida qayta tasniflangan, 11101 hisobvaragʻidan ushbu hisobvaraqqa oʻtkazilgan bank tomonidan sotib olingan debitorlik qarzlarining toʻliq va/yoki toʻlanmagan qiymati aks ettiriladi.","Hisobvaraqning kreditida qarzdorlar tomonidan toʻlangan yoki hisobdan chiqarilgan debitorlik qarzlarining summasi, shuningdek qayta tasniflangan, 11105 hisobvaragʻiga oʻtkazilgan sotib olingan muddati oʻtgan debitorlik qarzlarining qiymati aks ettiriladi."],"11105":["bank tomonidan sotib olingan sud jarayonidagi debitorlik qarzlarining hisobi olib boriladi.","Hisobvaraqning debetida qayta tasniflangan, 11101, 11103 hisobvaraqlaridan ushbu hisobvaraqqa oʻtkazilgan bank tomonidan sotib olingan debitorlik qarzlarining toʻliq va/yoki toʻlanmagan qiymati aks ettiriladi.","Hisobvaraqning kreditida qarzdorlar tomonidan qoplangan yoki hisobdan chiqarilgan debitorlik qarzlari summasi aks ettiriladi."],"11195":["sotib olingan debitorlik qarzlarining toʻliq nominal qiymati bilan sotib olish narxi oʻrtasidagi salbiy farq, yaʼni diskont hisobi olib boriladi.","Hisobvaraqning debetida diskont amortizatsiyasi, shuningdek qarzdor tomonidan debitorlik qarzlarini qisman yoki toʻliq qoplash natijasida yoki boshqa shaxslar hisobiga kechib yuborilganda hisobdan chiqarilgan diskont summasi aks ettiriladi.","Hisobvaraqning kreditida bankning debitorlik qarzini uning toʻliq nominal qiymatidan past narxda sotib olgandagi diskont summasi aks ettiriladi."],"11199":["qarzdordan summa undirib olinmagan va/yoki baholashda summa undirib olinishiga shubha tugʻilgan hollarda sotib olingan debitorlik qarzlari boʻyicha koʻrilishi mumkin boʻlgan zararlarni qoplash uchun tashkil etilgan zaxira hisobi olib boriladi.","Hisobvaraqning debetida zaxiraning kamayish summasi va/yoki bekor qilingan summasi aks ettiriladi.","Hisobvaraqning kreditida tashkil etilgan zaxira summasi va/yoki zaxiraning oʻsish summasi aks ettiriladi."],"11501":["bank tomonidan chiqarilgan va importning qiymatini toʻlash va/yoki akseptlash bilan bogʻliq boʻlgan xarajatlarni qoplash uchun moʻljallangan, akkreditiv kafolati asosida taqdim etilgan, import yoki sotib olish/toʻlash vakolati bilan bogʻliq boʻlgan veksel/trattalarning hisobi yuritiladi.","Hisobvaraqning debetida tovarlar yoki xizmatlar import uchun chet el vakil bankidan qabul qilingan akkreditiv boʻyicha taqdim etilgan veksellarning summasi aks ettiriladi.","Hisobvaraqning kreditida mijozlarning hisobvaraqlariga qoʻyilgan akkreditiv asosidagi veksellarning toʻlangan summasi, shuningdek qayta tasniflangan, 11511 va 11519 hisobvaraqlariga oʻtkazilgan veksellar summasi aks ettiriladi."],"11503":["mijozlarning akkreditiv va kafolatlari bilan bogʻliq boʻlgan toʻlovlari hisobi yuritiladi.","Hisobvaraqning debetida mijozlarning akkreditiv va kafolatlari boʻyicha toʻlab berilgan summasi aks ettiriladi.","Hisobvaraqning kreditida mijozlar tomonidan qoplab berilgan summalar, shuningdek qayta tasniflangan, import bilan bogʻliq akkreditivlar boʻyicha 11511, 11519 hisobvaraqlariga, mahalliy akkreditivlar boʻyicha 11515, 11521 hisobvaraqlariga oʻtkazilgan summalar summasi aks ettiriladi."],"11505":["importyor tomonidan trast bitimi asosida tovarlarni olishga oid hujjatlar berilgunga qadar/berilgan vaqtda akseptlangan, akkreditiv kafolati boʻyicha import uchun taqdim qilingan veksel/trattalarning hisobi olib boriladi.","Hisobvaraqning debetida trast hujjatlari asosida akseptlangan va oʻtkazib berilgan, akkreditiv kafolati boʻyicha taqdim qilingan import bilan bogʻliq veksel/trattalarning summasi aks ettiriladi.","Hisobvaraqning kreditida mijozlar hisobraqamlaridan undirib olingan taqdim etilgan akkreditiv kafolati boʻyicha import bilan bogʻliq veksel/trattalarning, shuningdek qayta tasniflangan, 11511 va 11519 hisobvaraqlariga oʻtkazilgan veksellar summasi aks ettiriladi."],"11509":["akkreditiv va/yoki trast hujjatlari bilan kafolatlangan mahalliy veksel/trattalarning qiymati hisobi olib boriladi.","Hisobvaraqning debetida akkreditiv va/yoki trast hujjatlari kafolati boʻyicha taqdim qilingan mahalliy veksel/trattalarning summasi aks ettiriladi.","Hisobvaraqning kreditida akkreditiv va/yoki trast hujjatlari kafolati asosida taqdim etilgan mahalliy veksel/trattalar boʻyicha mijozlarning hisobvaraqlaridan undirib olinadigan summa, shuningdek qayta tasniflangan, 11511 va 11519 hisobvaraqlariga oʻtkazilgan veksellar summasi aks ettiriladi."],"11511":["amaldagi qoidalarga muvofiq muddati oʻtgan deb hisoblanadigan, akkreditiv va/yoki trast hujjati kafolati asosida berilgan muddatida toʻlanmagan import bilan bogʻliq veksel/trattalar hisobga olinadi.","Hisobvaraqning debetida qayta tasniflangan, 11501, 11505 hisobvaraqlaridan ushbu hisobvaraqqa oʻtkazilgan, akkreditiv va/yoki trast kelishuvlari kafolati asosida qoʻyilgan, muddatida toʻlanmagan import bilan bogʻliq veksel/trattalarning qiymati aks ettiriladi.","Hisobvaraqning kreditida akkreditiv va/yoki trast kelishuvi kafolati asosida qoʻyilgan import bilan bogʻliq toʻlangan veksel/trattalarning qiymati va/yoki qadrsizlanish natijasida vujudga kelgan zararlarni qoplash 11599 hisobvaragʻidan qoplangan, shuningdek qayta tasniflangan, ushbu hisobvaraqdan 11519 hisobvaragʻiga…"],"11515":["amaldagi qoidalarga muvofiq muddati oʻtgan deb hisoblanadigan, akkreditiv va/yoki trast hujjati kafolati asosida berilgan muddatida toʻlanmagan mahalliy veksel/trattalar hisobga olinadi.","Hisobvaraqning debetida qayta tasniflangan, 11509 hisobvaragʻidan ushbu hisobvaraqqa oʻtkazilgan, akkreditiv va/yoki trast kelishuvi asosida qoʻyilgan, muddatida toʻlanmagan mahalliy veksel/trattalarning qiymati aks ettiriladi.","Hisobvaraqning kreditida akkreditiv va/yoki trast kafolati asosida qoʻyilgan va/yoki qadrsizlanish natijasida vujudga kelgan zararlarni qoplash 11599 hisobvaragʻidan hisobdan chiqarilgan, shuningdek qayta tasniflangan, 11521 hisobvaragʻidan ushbu hisobvaraqqa oʻtkazilgan toʻlangan veksel/trattalarning qiymati aks ettiriladi."],"11519":["akkreditiv va/yoki trast hujjatlari kafolati asosida qoʻyilgan sud ishi qoʻzgʻatilgan import bilan bogʻliq veksel/trattalarning hisobi olib boriladi.","Hisobvaraqning debetida qayta tasniflangan, 11501, 11505, 11511 hisobvaraqlaridan ushbu hisobvaraqqa oʻtkazilgan akkreditiv va/yoki trast hujjatlari kafolati asosida qoʻyilgan import bilan bogʻliq veksel/trattalarning summasi aks ettiriladi.","Hisobvaraqning kreditida qadrsizlanish natijasida vujudga kelgan zararlarni qoplash uchun tashkil etilgan zaxira 11599 hisobvaragʻidan hisobdan chiqarilgan va/yoki akkreditiv va/yoki trast hujjatlari kafolati asosida qoʻyilgan, toʻlangan veksel/trattalarning summasi aks ettiriladi."],"11521":["akkreditiv va/yoki trast hujjatlari kafolati asosida qoʻyilgan va ushbu yuzasidan sud ishi qoʻzgʻatilgan mahalliy veksel/trattalarning hisobi olib boriladi.","Hisobvaraqning debetida qayta tasniflangan, 11509, 11515 hisobvaraqlaridan ushbu hisobvaraqqa oʻtkazilgan akkreditiv va/yoki trast hujjatlari kafolatlari asosida qoʻyilgan mahalliy veksellarning summasi aks ettiriladi.","Hisobvaraqning kreditida akkreditiv va/yoki trast hujjatlari kafolati asosida qoʻyilgan, toʻlab berilgan mahalliy veksel/trattalarning va/yoki qadrsizlanish natijasida vujudga kelgan zararlarni qoplash uchun tashkil etilgan zaxira 11599 hisobvaragʻidan hisobdan chiqarilgan summalar aks ettiriladi."],"11599":["akkreditiv va/yoki trast hujjatlari kafolati asosida import bilan bogʻliq va mahalliy veksellar boʻyicha undirib olinmaslik ehtimoli borligi natijasida paydo boʻlishi mumkin boʻlgan zararlar hisobi olib boriladi.","Hisobvaraqning debetida zaxiraning bekor qilingan summasi aks ettiriladi.","Hisobvaraqning kreditida tashkil etilgan zaxira summasi aks ettiriladi."],"11701":["mahalliy savdo operatsiyalarini amalga oshirishda mijozlarga aksept shaklida berilgan muddatli veksel/trattalarning hisobi olib boriladi.","Hisobvaraqning debetida aksept shaklida berilgan veksel/trattalarning qiymati aks ettiriladi.","Hisobvaraqning kreditida aksept shaklidagi veksel/trattalarning toʻlangan qiymati aks ettiriladi."],"11705":["xalqaro savdo operatsiyalarini amalga oshirishda mijozlarga aksept shaklida berilgan muddatli veksel/trattalarning hisobi olib boriladi.","Hisobvaraqning debetida aksept shaklida berilgan veksel/trattalarning qiymati aks ettiriladi.","Hisobvaraqning kreditida aksept shaklida toʻlangan veksel/trattalarning qiymati aks ettiriladi."],"11897":["REPO bitimlari (qimmatli qogʻozlarni qaytadan sotib olish sharti bilan tuzilgan oldi-sotdi bitimlari toʻgʻrisidagi kelishuv) boʻyicha sotib olingan qimmatli qogʻozlar hisobi olib boriladi.","Hisobvaraqning debetida qimmatli qogʻozlarni qaytadan sotib olish sharti bilan tuzilgan oldi-sotdi bitimlari toʻgʻrisidagi kelishuvning birinchi qismi boʻyicha s  if(pool.length<4)pool=ks.filter(k=>seeds.some(s=>k.slice(0,2)===s.slice(0,2)));
 const c=rnd(pool),sh=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
 const same=ks.filter(k=>k!==c&&LEX[k]!==LEX[c]&&k.slice(0,2)===c.slice(0,2));
 const d=sh(same).sort((a,b)=>(b.slice(0,3)===c.slice(0,3))-(a.slice(0,3)===c.slice(0,3))||0).slice(0,3);
 const opts=sh([c,...d]),ok=opts.indexOf(c);

function fbLink(){const c=fbCfg||getFbCfg();if(!c)return '';const s={apiKey:c.apiKey,authDomain:c.authDomain,projectId:c.projectId,appId:c.appId};return location.href.split('#')[0]+'#fb='+btoa(JSON.stringify(s)).replace(/\+/g,'-').replace(/\//g,'_')}
function fbSave(){const s=($('#fbtxt')||{}).value||'';let c={};try{c=JSON.parse(s)}catch(e){}
 if(!c.apiKey){const re=/([A-Za-z]+)\s*:\s*["']([^"']+)["']/g;let m;while((m=re.exec(s)))c[m[1]]=m[2]}
 if(!c.apiKey||!c.projectId){msg='Sozlama topilmadi: Firebase’dagi firebaseConfig matnini to’liq joylang (apiKey va projectId bo’lishi kerak).';render();return}
 lsSet('fbcfg',c);location.hash='';location.reload()}
function fbOff(){if(!confirm('Umumiy bazadan uzilsinmi? Sahifa mahalliy rejimga o’tadi.'))return;try{localStorage.removeItem('fbcfg')}catch(e){}location.hash='';location.reload()}
function fbCopy(){const e=$('#fblink');if(!e)return;e.select();try{navigator.clipboard.writeText(e.value)}catch(x){document.execCommand('copy')}msg='Havola nusxalandi.';render()}
function fbBox(){if(typeof claude!=='undefined'&&!localMode&&!remoteMode)return canEdit?'':'<div class="box"><b>Eslatma:</b> saqlash uchun sahifani tahrirlash huquqi bilan (muallif hisobida) oching, aks holda o’zgarishlar saqlanmaydi.</div>';
 if(remoteMode)return `<div class="box"><b>Umumiy baza ulangan</b> (${esc(fbCfg.projectId)}). ${dbErr?`<br><b>Xato: ${esc(dbErr)}.</b> Firestore Database yoqilganini va Rules da <code>allow read, write: if true;</code> borligini tekshiring.`:''}<br>Talabalarga quyidagi havolani bering: shu havola orqali ular 6 xonali kod bilan kiradi va natijalari “Natijalar”da ko’rinadi.<br><input id="fblink" readonly style="width:100%" value="${esc(fbLink())}" onclick="this.select()"><br><button onclick="fbCopy()">Havolani nusxalash</button> <button onclick="fbOff()">Bazadan uzish</button><details><summary>Doimiy ulash (havolasiz)</summary>GitHub’dagi fayldan <code>const FB_CFG=null;</code> qatorini quyidagi bilan almashtiring, shunda talabalar oddiy havoladan ham kiradi:<br><textarea readonly rows="3" style="width:100%" onclick="this.select()">const FB_CFG=${esc(JSON.stringify({apiKey:fbCfg.apiKey,authDomain:fbCfg.authDomain,projectId:fbCfg.projectId,appId:fbCfg.appId}))};</textarea></details></div>`;
 return `<div class="box"><b>Umumiy baza ulanmagan:</b> ma’lumotlar faqat shu brauzerda saqlanadi, 6 xonali kod va talaba natijalari boshqa qurilmalarda ishlamaydi.<details><summary>Umumiy bazani ulash (Firebase, bir marta)</summary><ol><li>console.firebase.google.com da loyiha yarating, “Firestore Database” ni yoqing (Rules: <code>allow read, write: if true;</code>).</li><li>“Project settings” → “Your apps” → Web (&lt;/&gt;) ilova qo’shing va ko’rsatilgan <code>firebaseConfig</code> matnini quyiga joylang.</li></ol><textarea id="fbtxt" rows="6" style="width:100%" placeholder="const firebaseConfig = { apiKey: &quot;...&quot;, projectId: &quot;...&quot;, ... };"></textarea><br><button onclick="fbSave()">Ulash</button></details></div>`}
function localDb(){const K='ldb_',subs={};const rd=c=>{try{return JSON.parse(localStorage.getItem(K+c)||'{}')}catch(e){return {}}};
 const wr=(c,o)=>{try{localStorage.setItem(K+c,JSON.stringify(o))}catch(e){throw new Error('brauzer xotirasi to’lgan')}};
 const snap=c=>{const o=rd(c);return {docs:Object.keys(o).map(id=>({id:id,data:()=>JSON.parse(JSON.stringify(o[id]))}))}};
 const fire=c=>(subs[c]||[]).forEach(f=>{try{f(snap(c))}catch(e){}});
 return {collection:c=>({
  doc:id=>({set:async d=>{const o=rd(c);o[id]=JSON.parse(JSON.stringify(d));wr(c,o);fire(c)},
   update:async d=>{const o=rd(c);o[id]=Object.assign(o[id]||{},JSON.parse(JSON.stringify(d)));wr(c,o);fire(c)},
   delete:async()=>{const o=rd(c);delete o[id];wr(c,o);fire(c)},
   get:async()=>{const o=rd(c);return {exists:id in o,id:id,data:()=>o[id]}}}),
  get:async()=>snap(c),
  onSnapshot:(fn,er)=>{(subs[c]=subs[c]||[]).push(fn);setTimeout(()=>{try{fn(snap(c))}catch(e){}},0);return ()=>{subs[c]=(subs[c]||[]).filter(x=>x!==fn)}}})}}
(async()=>{try{
  const noClaude=typeof claude==='undefined';
  let u=null;
  if(!noClaude){u=await claude.use('user');canEdit=!!(u&&u.canEdit());try{uid=u?await u.id():null}catch(e){}}
  if(!uid){uid=lsGet('gid','');if(!uid){uid='g'+Math.random().toString(36).slice(2,10);lsSet('gid',uid)}}
  ready=true;
  if(!noClaude){try{aiS=await claude.use('sample')}catch(e){aiS=null}}
  if(!noClaude){try{db=await claude.use('db')}catch(e){db=null}}
  if(!db){
    const cfg=getFbCfg();
    if(cfg&&await loadFb()){try{firebase.initializeApp(cfg);db=firebase.firestore();db.settings({ignoreUndefinedProperties:true,experimentalAutoDetectLongPolling:true});fbCfg=cfg;remoteMode=true}catch(e){db=null}}
    if(!db){db=localDb();localMode=true;if(cfg)msg='Umumiy bazaga ulanib bo’lmadi (internet yoki sozlamani tekshiring): mahalliy rejim.'}
    canEdit=true;const _r=render;render=function(){canEdit=(role==='a'||role==='m');return _r()}}
  const typing=()=>document.activeElement&&(document.activeElement.tagName==='INPUT'||document.activeElement.tagName==='TEXTAREA');
  const sub=(c,fn)=>db.collection(c).onSnapshot(s=>{fn(s);if(!typing())render()},er=>{dbErr=(er&&(er.code||er.message))||'xato';if(c==='sess')sload=true;render()});
  if(db){
    sub('tasks',s=>{tasks=SAMPLE.concat(s.docs.map(d=>Object.assign({id:d.id,db:1},d.data())))});
    sub('accounts',s=>{extra={};s.docs.forEach(d=>{extra[d.id]=(d.data()||{}).name||''})});
    sub('doctpl',s=>{dtpl={};s.docs.forEach(d=>{dtpl[d.id]=d.data()})});
    sub('sess',s=>{sessions={};s.docs.forEach(d=>{sessions[d.id]=d.data()});sload=true});
    sub('tests',s=>{tests={};s.docs.forEach(d=>{tests[d.id]=d.data()})});
    sub('testans',s=>{s.docs.forEach(d=>{if(!(d.id in tans)||!d.id.endsWith('_'+uid))tans[d.id]=d.data()})});
    sub('rates',s=>{ratesDb=null;s.docs.forEach(d=>{if(d.id==='cbu')ratesDb=d.data()})});
    sub('actlog',s=>{acts=s.docs.map(d=>Object.assign({_id:d.id},d.data()))});
  }else{sload=true}
  render();
}catch(e){ready=true;sload=true;render()}})();

</script></body></html>
